<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Agent - Real Estate Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Simple Nav -->
    <nav class="navbar navbar-light bg-white mb-5 shadow-sm">
        <div class="container px-4">
            <a class="navbar-brand font-weight-bold" href="index.html">
                <i class="bi bi-building me-2"></i>RealEstate.co
            </a>
            <a href="property_details.html" class="btn btn-outline-secondary btn-sm">Close</a>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Agent Info Card -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4 d-flex align-items-center">
                        <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=0d6efd&color=fff"
                            class="rounded-circle me-4 shadow-sm" width="80" height="80" alt="Agent">
                        <div>
                            <h2 class="h4 fw-bold mb-1">Jane Doe</h2>
                            <p class="text-muted mb-2">Premier Real Estate Brokers</p>
                            <p class="mb-0 small"><i class="bi bi-telephone text-primary me-2"></i> (555) 123-4567</p>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="card border-0 shadow-lg p-5">
                    <h3 class="fw-bold mb-2">Send a Message</h3>
                    <p class="text-muted mb-4">Currently inquiring about: <strong class="text-dark">456 Maple
                            Ave</strong></p>

                    <form action="property_details.html">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">First Name</label>
                                <input type="text" class="form-control form-control-lg bg-light" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Last Name</label>
                                <input type="text" class="form-control form-control-lg bg-light" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Email Address</label>
                            <input type="email" class="form-control form-control-lg bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Phone (Optional)</label>
                            <input type="tel" class="form-control form-control-lg bg-light">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Message</label>
                            <textarea class="form-control form-control-lg bg-light" rows="5"
                                required>Hi Jane, I am interested in learning more about 456 Maple Ave. Please contact me at your earliest convenience.</textarea>
                        </div>

                        <div class="alert alert-success d-none mb-4" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i> Message sent successfully!
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold fs-5">
                            <i class="bi bi-send me-2"></i> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
