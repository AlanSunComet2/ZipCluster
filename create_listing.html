<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Agent Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand font-weight-bold" href="agent_dashboard.html">
                <i class="bi bi-building me-2 text-primary"></i>RealEstate.co <span
                    class="badge bg-primary ms-2 fs-6">Agent</span>
            </a>

            <div class="d-flex align-items-center ms-auto">
                <a href="my_listings.html" class="btn btn-outline-light me-3">Cancel</a>
                <div class="dropdown">
                    <a href="#" class="d-block link-light text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=0d6efd&color=fff" width="32"
                            height="32" class="rounded-circle">
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar border-end"
                style="min-height: calc(100vh - 56px);">
                <div class="position-sticky pt-4 px-3">
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item">
                            <a class="nav-link fs-5 text-dark" href="agent_dashboard.html">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary bg-light rounded fs-5" href="my_listings.html">
                                <i class="bi bi-house-door me-2"></i> My Listings
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content (US-002) -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <h1 class="h2 fw-bold mb-4">Create New Listing</h1>

                        <form action="my_listings.html">

                            <!-- Basic Info -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                    <h5 class="fw-bold mb-0">1. Basic Details</h5>
                                </div>
                                <div class="card-body p-4">
                                    <div class="mb-3">
                                        <label class="form-label text-muted fw-bold">Listing Title</label>
                                        <input type="text" class="form-control form-control-lg bg-light"
                                            placeholder="e.g. Stunning Modern Masterpiece Downtown" required>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Property Type</label>
                                            <select class="form-select form-select-lg bg-light" required>
                                                <option selected disabled>Select Type...</option>
                                                <option value="House">Single Family House</option>
                                                <option value="Condo">Condo / Apartment</option>
                                                <option value="Townhouse">Townhouse</option>
                                                <option value="Land">Land</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted fw-bold">Listing Price ($)</label>
                                            <input type="number" class="form-control form-control-lg bg-light"
                                                placeholder="0.00" min="1" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted fw-bold">Property Description</label>
                                        <textarea class="form-control bg-light" rows="5"
                                            placeholder="Describe the key features, neighborhood, etc..."
                                            required></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Location Info -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                    <h5 class="fw-bold mb-0">2. Location</h5>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row mb-3">
                                        <div class="col-md-8 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Street Address</label>
                                            <input type="text" class="form-control bg-light" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label text-muted fw-bold">Apt / Unit (Optional)</label>
                                            <input type="text" class="form-control bg-light">
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-md-4 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">ZIP Code</label>
                                            <!-- Assignment specific: trigger auto-fill flow here -->
                                            <input type="text" class="form-control bg-light" placeholder="Enter ZIP"
                                                required>
                                            <div class="form-text small text-info"><i class="bi bi-magic me-1"></i>
                                                Entering ZIP will auto-fill City & State</div>
                                        </div>
                                        <div class="col-md-4 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">City</label>
                                            <input type="text" class="form-control bg-light" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label text-muted fw-bold">State</label>
                                            <select class="form-select bg-light" required>
                                                <option selected disabled>State</option>
                                                <option value="TX">Texas</option>
                                                <option value="CA">California</option>
                                                <option value="NY">New York</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Specs -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                    <h5 class="fw-bold mb-0">3. Specifications</h5>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row mb-3">
                                        <div class="col-md-4 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Bedrooms</label>
                                            <input type="number" class="form-control bg-light" min="0" required>
                                        </div>
                                        <div class="col-md-4 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Bathrooms</label>
                                            <input type="number" class="form-control bg-light" min="0" step="0.5"
                                                required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label text-muted fw-bold">Square Footage</label>
                                            <input type="number" class="form-control bg-light" min="0" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Media -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                    <h5 class="fw-bold mb-0">4. Media (Photos & Videos)</h5>
                                </div>
                                <div class="card-body p-4 text-center">
                                    <div class="p-5 border border-dashed rounded bg-light mb-3"
                                        style="border-width: 2px !important; border-color: #dee2e6 !important;">
                                        <i class="bi bi-cloud-arrow-up display-4 text-muted mb-3"></i>
                                        <h5 class="fw-bold">Drag and drop photos/videos here</h5>
                                        <p class="text-muted small mb-4">or click to browse from your device</p>
                                        <input type="file" class="d-none" id="fileUpload" multiple
                                            accept="image/*,video/*">
                                        <button type="button" class="btn btn-outline-primary"
                                            onclick="document.getElementById('fileUpload').click()">Browse
                                            Files</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Status & Submit -->
                            <div class="card border-0 shadow-sm bg-primary text-white mb-5">
                                <div class="card-body p-4">
                                    <div class="row align-items-center">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label fw-bold">Publishing Status</label>
                                            <select class="form-select" required>
                                                <option value="Available" selected>Available (Submit for Approval)
                                                </option>
                                                <option value="Pending">Pending Sale</option>
                                                <option value="Sold">Sold</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 d-flex justify-content-end gap-2 mt-md-4">
                                            <button type="button" class="btn btn-light text-primary fw-bold">Save as
                                                Draft</button>
                                            <button type="submit" class="btn btn-warning fw-bold text-dark">Submit
                                                Listing</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
