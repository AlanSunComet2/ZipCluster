<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing - Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Agent Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand font-weight-bold" href="agent_dashboard.html">
                <i class="bi bi-building me-2 text-primary"></i>RealEstate.co <span
                    class="badge bg-primary ms-2 fs-6">Agent</span>
            </a>

            <div class="d-flex align-items-center ms-auto">
                <a href="my_listings.html" class="btn btn-outline-light me-3">Cancel</a>
                <div class="dropdown">
                    <a href="#" class="d-block link-light text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=0d6efd&color=fff" width="32"
                            height="32" class="rounded-circle">
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar border-end"
                style="min-height: calc(100vh - 56px);">
                <div class="position-sticky pt-4 px-3">
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item">
                            <a class="nav-link fs-5 text-dark" href="agent_dashboard.html">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary bg-light rounded fs-5" href="my_listings.html">
                                <i class="bi bi-house-door me-2"></i> My Listings
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content (US-003) -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h1 class="h2 fw-bold mb-0">Edit Listing: 456 Maple Ave</h1>
                            <button type="button" class="btn btn-outline-danger"><i class="bi bi-trash me-2"></i>Delete
                                Listing</button>
                        </div>

                        <!-- Data Alert per Assignment req -->
                        <div class="alert alert-warning mb-4 shadow-sm" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> Modifying major fields directly (Price,
                            Description) will return the property status to "Pending Review" by an Admin.
                        </div>

                        <form action="my_listings.html">

                            <!-- Basic Info -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                    <h5 class="fw-bold mb-0">Basic Details</h5>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row mb-3">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Listing Title</label>
                                            <input type="text" class="form-control form-control-lg bg-light"
                                                value="Contemporary Downtown Masterpiece" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted fw-bold">Listing Price ($)</label>
                                            <input type="number" class="form-control form-control-lg bg-light"
                                                value="1200000" min="1" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted fw-bold">Property Description</label>
                                        <textarea class="form-control bg-light" rows="5"
                                            required>Stunning contemporary masterpiece located in the highly desirable 78704 zip code. This 5-bedroom, 4-bathroom home features an open-concept living area with floor-to-ceiling windows...</textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Media Managment -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div
                                    class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">Manage Media</h5>
                                    <button type="button" class="btn btn-sm btn-outline-primary shadow-sm"><i
                                            class="bi bi-upload me-1"></i> Upload More</button>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row g-3">
                                        <!-- Photo Thumbnail -->
                                        <div class="col-4 col-md-3 position-relative">
                                            <button type="button"
                                                class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 z-3 rounded-circle"><i
                                                    class="bi bi-x"></i></button>
                                            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9"
                                                class="img-fluid rounded object-fit-cover w-100" style="height: 100px;">
                                            <div class="text-center mt-1"><span class="badge bg-primary">Cover
                                                    Photo</span></div>
                                        </div>
                                        <div class="col-4 col-md-3 position-relative">
                                            <button type="button"
                                                class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 z-3 rounded-circle"><i
                                                    class="bi bi-x"></i></button>
                                            <img src="https://images.unsplash.com/photo-1600607687931-cecebd808cbd"
                                                class="img-fluid rounded object-fit-cover w-100" style="height: 100px;">
                                            <div class="text-center mt-1"><a href="#"
                                                    class="small text-decoration-none">Make Cover</a></div>
                                        </div>
                                        <div class="col-4 col-md-3 position-relative">
                                            <button type="button"
                                                class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 z-3 rounded-circle"><i
                                                    class="bi bi-x"></i></button>
                                            <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3"
                                                class="img-fluid rounded object-fit-cover w-100" style="height: 100px;">
                                            <div class="text-center mt-1"><a href="#"
                                                    class="small text-decoration-none">Make Cover</a></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Status & Submit -->
                            <div class="card border-0 shadow-sm bg-primary text-white mb-5">
                                <div class="card-body p-4">
                                    <div class="row align-items-center">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label fw-bold">Change Publishing Status</label>
                                            <select class="form-select" required>
                                                <option value="Available" selected>Active</option>
                                                <option value="Pending">Pending Sale</option>
                                                <option value="Sold">Sold (Finalize Listing)</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 d-flex justify-content-end gap-2 mt-md-4">
                                            <button type="button" class="btn btn-light fw-bold text-primary px-4">Save
                                                Changes</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
