<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Real Estate Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Simple Nav -->
    <nav class="navbar navbar-light bg-white mb-5 shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand font-weight-bold m-0" href="index.html">
                <i class="bi bi-building me-2"></i>RealEstate.co
            </a>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                        <ul class="nav nav-tabs justify-content-center border-bottom-0" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold fs-5 px-4" id="login-tab" data-bs-toggle="tab"
                                    data-bs-target="#login" type="button" role="tab" aria-controls="login"
                                    aria-selected="true">Log In</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold fs-5 px-4" id="register-tab" data-bs-toggle="tab"
                                    data-bs-target="#register" type="button" role="tab" aria-controls="register"
                                    aria-selected="false">Register</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-5 pt-4">
                        <div class="tab-content" id="myTabContent">

                            <!-- Login Form -->
                            <div class="tab-pane fade show active" id="login" role="tabpanel"
                                aria-labelledby="login-tab">
                                <form action="search_properties.html">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">Email address</label>
                                        <input type="email" class="form-control form-control-lg"
                                            placeholder="name@example.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <div class="d-flex justify-content-between">
                                            <label class="form-label text-muted">Password</label>
                                            <a href="#" class="text-decoration-none small text-primary">Forgot
                                                password?</a>
                                        </div>
                                        <input type="password" class="form-control form-control-lg"
                                            placeholder="••••••••" required>
                                    </div>
                                    <div class="mb-4 form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberMe">
                                        <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Log In</button>

                                    <div class="text-center position-relative my-4">
                                        <hr class="text-muted">
                                        <span
                                            class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted small">OR</span>
                                    </div>

                                    <button type="button" class="btn btn-outline-dark btn-lg w-100 mb-2">
                                        <i class="bi bi-google me-2"></i> Continue with Google
                                    </button>
                                </form>
                            </div>

                            <!-- Register Form (UC-007) -->
                            <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                                <form action="search_properties.html">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-muted">First Name</label>
                                            <input type="text" class="form-control form-control-lg" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-muted">Last Name</label>
                                            <input type="text" class="form-control form-control-lg" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">Email address</label>
                                        <input type="email" class="form-control form-control-lg" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">Password</label>
                                        <input type="password" class="form-control form-control-lg" required>
                                        <div class="form-text text-muted small">Must be at least 8 characters and
                                            include symbols.</div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-muted">Account Type</label>
                                        <select class="form-select form-select-lg">
                                            <option value="user" selected>Buyer / Investor</option>
                                            <option value="agent">Real Estate Agent</option>
                                        </select>
                                    </div>
                                    <div class="mb-4 form-check">
                                        <input type="checkbox" class="form-check-input" id="termsAgree" required>
                                        <label class="form-check-label text-muted" for="termsAgree">I agree to the <a
                                                href="#">Terms of Service</a></label>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100">Create Account</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
