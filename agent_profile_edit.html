<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Agent Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand font-weight-bold" href="agent_dashboard.html">
                <i class="bi bi-building me-2 text-primary"></i>RealEstate.co <span
                    class="badge bg-primary ms-2 fs-6">Agent</span>
            </a>

            <div class="d-flex align-items-center ms-auto">
                <a href="agent_public_profile.html" class="btn btn-outline-light me-3">View Public Profile</a>
                <div class="dropdown">
                    <a href="#" class="d-block link-light text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=0d6efd&color=fff" width="32"
                            height="32" class="rounded-circle">
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar border-end"
                style="min-height: calc(100vh - 56px);">
                <div class="position-sticky pt-4 px-3">
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item">
                            <a class="nav-link fs-5 text-dark" href="agent_dashboard.html">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item mt-4">
                            <h6 class="sidebar-heading px-3 mt-4 mb-2 text-muted text-uppercase fw-bold">Account</h6>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary bg-light rounded fs-5" href="agent_profile_edit.html">
                                <i class="bi bi-person-gear me-2"></i> Edit Profile
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content (UC-001) -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <div class="d-flex align-items-center mb-4">
                            <h1 class="h2 fw-bold mb-0">Edit Public Profile</h1>
                            <span class="badge bg-success ms-3 py-2 px-3">Status: Approved</span>
                        </div>

                        <!-- Profile Form -->
                        <div class="card border-0 shadow-sm mb-5">
                            <div class="card-body p-5">
                                <form action="agent_dashboard.html">

                                    <!-- Photo Upload -->
                                    <div class="mb-5 text-center">
                                        <div class="position-relative d-inline-block">
                                            <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=0d6efd&color=fff&size=150"
                                                class="rounded-circle shadow mb-3" alt="Profile">
                                            <button type="button"
                                                class="btn btn-primary rounded-circle position-absolute bottom-0 end-0 mb-3 me-2 shadow-sm"
                                                style="width: 40px; height: 40px;">
                                                <i class="bi bi-camera-fill"></i>
                                            </button>
                                        </div>
                                        <div class="small text-muted">Allowed formats: JPG, PNG. Max size: 2MB.</div>
                                    </div>

                                    <h4 class="fw-bold border-bottom pb-2 mb-4">Personal Information</h4>

                                    <div class="row mb-4">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">First Name</label>
                                            <input type="text" class="form-control form-control-lg bg-light"
                                                value="Jane" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted fw-bold">Last Name</label>
                                            <input type="text" class="form-control form-control-lg bg-light" value="Doe"
                                                required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label text-muted fw-bold">Biography</label>
                                        <textarea class="form-control form-control-lg bg-light"
                                            rows="5">Dedicated real estate professional with over 10 years of experience helping families find their dream homes in the Austin area. I specialize in luxury condos and single-family residences.</textarea>
                                    </div>

                                    <h4 class="fw-bold border-bottom pb-2 mb-4 mt-5">Contact Information</h4>

                                    <div class="row mb-4">
                                        <div class="col-md-6 mb-3 mb-md-0">
                                            <label class="form-label text-muted fw-bold">Email Address (Public)</label>
                                            <input type="email" class="form-control form-control-lg bg-light"
                                                value="jane.doe@example.com" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted fw-bold">Phone Number</label>
                                            <input type="tel" class="form-control form-control-lg bg-light"
                                                value="(555) 123-4567" required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label text-muted fw-bold">Office Address</label>
                                        <input type="text" class="form-control form-control-lg bg-light"
                                            value="100 Congress Ave, Suite 2000, Austin, TX 78701">
                                    </div>

                                    <h4 class="fw-bold border-bottom pb-2 mb-4 mt-5">License Documentation</h4>

                                    <div class="mb-4">
                                        <label class="form-label text-muted fw-bold">Real Estate License Number</label>
                                        <input type="text" class="form-control form-control-lg bg-light"
                                            value="TX-987654321" required>
                                    </div>

                                    <div class="mb-5">
                                        <label class="form-label text-muted fw-bold">Upload New License
                                            (PDF/Image)</label>
                                        <input class="form-control mb-2" type="file" id="formFile">
                                        <div class="small text-muted"><i
                                                class="bi bi-file-earmark-check text-success me-1"></i> Current license
                                            on file expires 12/2026.</div>
                                    </div>

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                                        <button class="btn btn-outline-secondary btn-lg me-md-2"
                                            type="button">Cancel</button>
                                        <button class="btn btn-primary btn-lg px-5" type="submit">Save Changes</button>
                                    </div>

                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
