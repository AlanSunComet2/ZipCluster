<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Properties - Real Estate Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Logged in Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container px-4">
            <a class="navbar-brand font-weight-bold" href="index.html">
                <i class="bi bi-building me-2"></i>RealEstate.co
            </a>

            <div class="d-flex align-items-center ms-auto">
                <a href="search_properties.html" class="nav-link me-4">Search</a>
                <div class="dropdown">
                    <a href="#" class="d-block link-dark text-decoration-none dropdown-toggle" id="dropdownUser"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=User+Account&background=0d6efd&color=fff" width="32"
                            height="32" class="rounded-circle">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="saved_properties.html">Saved Properties</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="index.html">Sign out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold m-0"><i class="bi bi-heart-fill text-danger me-2"></i> Saved Properties (2)</h1>
        </div>

        <div class="row g-4">
            <!-- Property Card -->
            <div class="col-md-4">
                <div class="card h-100 position-relative">
                    <button
                        class="btn btn-light rounded-circle position-absolute top-0 end-0 m-2 p-2 shadow-sm z-3 text-danger"
                        title="Remove">
                        <i class="bi bi-heart-fill"></i>
                    </button>
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
                        class="card-img-top" alt="House">
                    <div class="card-body">
                        <h3 class="card-title h5 fw-bold">$850,000</h3>
                        <p class="card-text text-muted mb-2 small">123 Sunset Blvd, Austin, TX 78704</p>
                        <div class="d-flex justify-content-between text-muted small">
                            <span><i class="bi bi-house-door"></i> 4bd</span>
                            <span><i class="bi bi-droplet"></i> 3ba</span>
                            <span><i class="bi bi-arrows-fullscreen"></i> 2,500sqft</span>
                        </div>
                    </div>
                    <div class="card-footer bg-white pt-0 border-top-0 mt-2">
                        <a href="property_details.html" class="btn btn-outline-primary w-100">View Listing</a>
                    </div>
                </div>
            </div>

            <!-- Property Card -->
            <div class="col-md-4">
                <div class="card h-100 position-relative">
                    <span class="badge badge-status-sold position-absolute top-0 start-0 m-2 z-3">Pending</span>
                    <button
                        class="btn btn-light rounded-circle position-absolute top-0 end-0 m-2 p-2 shadow-sm z-3 text-danger"
                        title="Remove">
                        <i class="bi bi-heart-fill"></i>
                    </button>
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
                        class="card-img-top" alt="House" style="filter: grayscale(100%);">
                    <div class="card-body">
                        <h3 class="card-title h5 fw-bold">$450,000</h3>
                        <p class="card-text text-muted mb-2 small">789 Oak Lane, Austin, TX 78701</p>
                        <div class="d-flex justify-content-between text-muted small">
                            <span><i class="bi bi-house-door"></i> 3bd</span>
                            <span><i class="bi bi-droplet"></i> 2ba</span>
                            <span><i class="bi bi-arrows-fullscreen"></i> 1,800sqft</span>
                        </div>
                    </div>
                    <div class="card-footer bg-white pt-0 border-top-0 mt-2">
                        <a href="property_details.html" class="btn btn-outline-secondary w-100">View Listing</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
